
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="todo-container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Plan your day, one task at a time.</p>

        <form id="todo-form">
            <input
                type="text"
                id="todo-input"
                placeholder="Enter a task..."
                autocomplete="off"
                aria-label="New task"
            >
            <button type="submit">Add Task</button>
        </form>

        <p id="task-count">0 tasks remaining</p>
        
<div class="filters">
    <button type="button" class="filter-btn active" data-filter="all">All</button>
    <button type="button" class="filter-btn" data-filter="pending">Pending</button>
    <button type="button" class="filter-btn" data-filter="completed">Completed</button>
</div>


        <ul id="todo-list"></ul>

        <p class="footer">Stay focused. Keep growing.</p>
    </main>
</body>
</html>
